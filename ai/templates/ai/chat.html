{% extends "ai/base_chat.html" %}

{% block extra_meta %}
    {% if external_session_id %}
    <meta name="external-session-id" content="{{ external_session_id }}">
    {% endif %}
{% endblock %}

{% block chat_selected %}selected{% endblock %}

{% block form_content %}
    <textarea type="text" id="messageText"
        data-node-id="{{ node_id }}"
        placeholder="{{ t.placeholder }}"
        autocomplete="off"></textarea>
{% endblock %}

{% block extra_body_script %}
<script>
    // nid из DL-ссылки («Чат с DLAI» на странице задачи): текст задачи
    // подставляется в поле сообщения (chat_template.js по AI_TASK_NODE_ID).
    window.AI_TASK_NODE_ID = document.getElementById('messageText')?.dataset.nodeId || '';
</script>
{% endblock %}
