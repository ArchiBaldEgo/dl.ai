<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Нет доступа к админке — DLAI</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f6f7f9;
            color: #1f2933;
            font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .card {
            max-width: 520px;
            margin: 24px;
            padding: 32px 36px;
            background: #fff;
            border: 1px solid #dcdfe4;
            border-radius: 10px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, .08);
        }
        h1 { margin: 0 0 12px; font-size: 22px; }
        p { margin: 0 0 16px; color: #3e4c59; }
        a.button {
            display: inline-block;
            padding: 10px 18px;
            background: #417690;
            color: #fff;
            border-radius: 6px;
            text-decoration: none;
        }
        a.button:hover { background: #345c72; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Нет доступа к админ-панели</h1>
        <p>
            Ваша учётная запись не имеет прав на вход в админ-панель.
            Если доступ нужен, попросите администратора выдать соответствующую роль
            на странице «Группы доступа».
        </p>
        <p>
            Чат, «Реши задачу», «Найди ошибку» и «Мои модели» доступны как обычно.
        </p>
        <a href="/ai/chat/" class="button">Перейти в чат</a>
    </div>
</body>
</html>
