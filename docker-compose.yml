services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Keep apt/pip on direct connection (HTTP_PROXY/HTTPS_PROXY are empty in .env).
        HTTP_PROXY: "${HTTP_PROXY:-}"
        HTTPS_PROXY: "${HTTPS_PROXY:-}"
        NO_PROXY: "${NO_PROXY:-localhost,127.0.0.1,db,nginx,.local}"
        # Puppeteer Chromium download needs the real corporate proxy.
        NPM_HTTP_PROXY: "${RUNTIME_HTTP_PROXY:-}"
        NPM_HTTPS_PROXY: "${RUNTIME_HTTPS_PROXY:-}"
    container_name: dl_ai_web
    restart: unless-stopped
    mem_limit: 2g
    memswap_limit: 2g
    oom_kill_disable: false
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - WebDeepseek_node_modules:/app/WebDeepseek/node_modules
      - WebKimi_node_modules:/app/WebKimi/node_modules
#      - WebDeepseek_puppeteer_cache:/app/WebDeepseek/.puppeteer-cache
    ports:
      - "8000:8000"
    env_file:
      - .env
    # NOTE: WebDeepseek/.env no longer exists — all bot vars (PORT, MAX_BOT_COUNT,
    # BOT_USERNAME/BOT_PASSWORD, BOT_PROXY*, etc.) now live in the root .env.
    # Do NOT remap PUPPETEER_PROXY_* -> BOT_PROXY* via `environment:` here.
    # `environment:` overrides `env_file:`, so an explicit mapping with an empty
    # fallback ("${PUPPETEER_PROXY_SERVER:-}") wipes BOT_PROXY* from .env,
    # leaving the browser with NO proxy -> login can't reach chat.deepseek.com
    # -> 401 not_autorized. WebDeepseek/worker/bot.js resolveProxy() already
    # falls back to PUPPETEER_PROXY_* when BOT_PROXY is empty, so both naming
    # schemes work without any mapping here.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health >/dev/null && python3 -c \"import urllib.request,json,sys; d=json.load(urllib.request.urlopen('http://localhost:3000/health', timeout=5)); k=json.load(urllib.request.urlopen('http://localhost:3001/health', timeout=5)); sys.exit(0 if d.get('ok') and d.get('ready_count',0) > 0 and k.get('ok') else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    depends_on:
      - db
      - redis
    networks:
      - shared-network

  db:
    image: postgres:14
    container_name: dl_ai_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: "${DB_USER:-dlaibd}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-dlaibd}"
      POSTGRES_DB: "${DB_NAME:-dl_ai}"
    networks:
      - shared-network

  redis:
    image: redis:7-alpine
    container_name: dl_ai_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - shared-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  nginx:
    image: nginx:latest
    container_name: dl_ai_nginx
    restart: unless-stopped
    ports:
      - "${AI_NGINX_BIND:-0.0.0.0}:${AI_NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx:/etc/nginx/conf.d
      - static_volume:/app/staticfiles
    depends_on:
      - web
    networks:
      - shared-network


volumes:
  postgres_data:
    name: "${POSTGRES_VOLUME_NAME:-dlai_postgres_data}"
  redis_data:
    name: "${REDIS_VOLUME_NAME:-dlai_redis_data}"
  static_volume:
  WebDeepseek_node_modules:
  WebDeepseek_puppeteer_cache:
  WebKimi_node_modules:

networks:
  shared-network:
    name: "${DOCKER_NETWORK_NAME:-dlai-network}"
